[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-revisiter-applications"
version = "0.1.0"
description = "Assistant de compréhension et de transformation guidée d'applications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1,<2",
  "langchain-ollama>=1,<2",
  "langgraph>=1,<2",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "flask>=3.1,<4",
  "markdown-it-py>=3,<5",
  "streamlit>=1.66,<2",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.13.0",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-embedded-template==0.25.0",
  "tree-sitter-yaml==0.7.2",
]

[project.optional-dependencies]
nlp = ["torch>=2.6,<3", "transformers>=4.50,<6", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
vocal = ["faster-whisper==1.2.1"]

[project.scripts]
revisiter = "revisiter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revisiter = ["templates/*.html", "static/*.css", "static/*.js", "interface.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
